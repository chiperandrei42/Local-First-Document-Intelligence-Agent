<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="22" fill="#060607"/>
  <defs>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#D8B4FE"/>
      <stop offset="100%" stop-color="#614DFF"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#614DFF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#614DFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#614DFF" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Back Orbital Ring -->
    <path d="M 16 56 C 22 38, 62 26, 86 38" stroke="url(#ringGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Central 'C' Planet Crescent -->
    <path d="M 66 20 C 36 16, 18 32, 18 50 C 18 68, 36 84, 66 80 C 42 76, 32 64, 32 50 C 32 36, 42 24, 66 20 Z" fill="url(#planetGrad)"/>

    <!-- Front Outer Dynamic Ring -->
    <path d="M 8 58 C 12 76, 52 90, 92 56" stroke="url(#ringGrad)" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Front Inner Highlight Ring -->
    <path d="M 22 62 C 30 73, 56 81, 82 60" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
  </g>
</svg>
